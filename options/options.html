<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>GitMark — 设置</title>
    <link rel="stylesheet" href="../popup/popup.css" />
    <style>
      body {
        width: 520px;
      }
    </style>
  </head>
  <body class="i18n-pending">
    <h1 data-i18n="settingsTitle">GitMark — 设置</h1>

    <section class="card">
      <div class="row">
        <span class="k" data-i18n="tokenStateLabel">Token 状态</span>
        <span class="v" id="tokenState" data-i18n="tokenStateChecking">检查中…</span>
      </div>
      <div class="row" style="margin-top: 10px">
        <span class="k" data-i18n="langLabel">语言</span>
        <select id="langSelect" class="lang-select">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </section>

    <section class="card">
      <label for="token" data-i18n="patLabel">Personal Access Token</label>
      <input
        type="password"
        id="token"
        data-i18n-ph="patPlaceholder"
        placeholder="ghp_… 或 fine-grained token"
        autocomplete="off"
      />
      <div class="btns">
        <button id="save" class="btn primary" data-i18n="save">保存</button>
        <button id="clear" class="btn" data-i18n="clear">清除</button>
      </div>
      <p class="hint">
        <b data-i18n="permHintOptionsClassic">经典 Token：勾选 repo 权限。</b><br />
        <b data-i18n="permHintOptionsFine"
          >Fine-grained：授权目标仓库的 Contents: Read and write。</b
        ><br />
        <span data-i18n="permHintOptionsStorage"
          >Token 仅存储在浏览器本地（chrome.storage.local），不会发送到 GitHub
          以外的任何地方。</span
        >
      </p>
      <a
        href="https://github.com/settings/tokens?type=beta"
        target="_blank"
        class="link"
        data-i18n="createTokenFine"
        >创建 Fine-grained Token →</a
      >
    </section>

    <script type="module" src="../popup/popup.js"></script>
  </body>
</html>
